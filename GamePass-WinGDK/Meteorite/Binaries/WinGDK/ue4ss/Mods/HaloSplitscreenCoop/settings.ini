; Halo: Campaign Evolved - Co-op Expanded input configuration
; v1.11.0
;
; Close Halo before changing this file, then restart the game.
;
; Controllers=2 (default / backward-compatible)
;   Player 1: keyboard/mouse and controller 1
;   Player 2: controller 2
;   Uses Halo's normal two-controller assignment.
;
; Controllers=1
;   Player 1: keyboard/mouse
;   Player 2: first gamepad
;
;   Steam / Win64:
;     Supports native Xbox/XInput and Steam Input virtual controllers through
;     Co-op Expanded's adaptive router. Release testing includes
;     Xbox, DualSense/PS5, 8BitDo Lite 2 and PS3-class controllers, wired/wireless,
;     connected before launch and connected after Halo reached the frontend.
;
;   Xbox App / PC Game Pass / WinGDK:
;     Supports the native Xbox/XInput route only. PlayStation/other non-native
;     controller families are a known limitation in Controllers=1 on Game Pass.
;
; Use only 1 or 2.

[Input]
Controllers=2

; Classic armor slot policy. Restart Halo after changing this value.
; 1 (default): all 12 Classic colors are available. Six Classic colors replace
;              six stock armor entries because the native table is limited to 32 slots.
; 0:           preserve all stock armor entries. The six Classic colors with their
;              own dedicated native slots remain available: WHITE, BLACK, RED,
;              BLUE, CYAN and ORANGE.
[Armor]
ReplaceStockArmorWithClassic=1
